<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="manifest" href="/manifest.json"><title>Gantu dashboard · Sign in</title><style>body{font:16px system-ui;background:#141119;color:#eee4f0;color-scheme:dark;margin:12vh auto;padding:24px;max-width:420px}input,button{font:inherit;width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border:1px solid #4b384e;background:#241b2c;color:#eee4f0;border-radius:8px}button{background:#ed8129;color:#1a101a}p{line-height:1.6;color:#b3a0bf}</style><h1>Gantu dashboard</h1><p>Enter the access code from the computer that runs your Gantu dashboard.</p><form id="login"><input id="code" type="password" autocomplete="current-password" placeholder="Access code" required aria-label="Access code"><button>Open dashboard</button></form><p id="status"></p><script>
async function login(code){document.getElementById('status').textContent='Connecting…';try{const r=await fetch('/session',{method:'POST',headers:{Authorization:'Bearer '+code}});if(r.ok){const p=new URLSearchParams(location.hash.slice(1));p.set('access',code);try{localStorage.setItem('walk-access',code)}catch(_){}history.replaceState(null,'','/#'+p.toString());location.reload()}else document.getElementById('status').textContent='Access code was not accepted.'}catch(e){document.getElementById('status').textContent='Connection unavailable. Try again.'}}
document.getElementById('login').onsubmit=e=>{e.preventDefault();login(document.getElementById('code').value.trim())};let code=new URLSearchParams(location.hash.slice(1)).get('access');try{code=code||localStorage.getItem('walk-access')}catch(_){}if(code)login(code);
</script></html>
